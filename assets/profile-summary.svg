    <text x="120" y="273" fill="#7DD3FC">ERP Delivery</text>
    <rect x="262" y="248" width="164" height="38" rx="19" fill="#0F6CBD" fill-opacity="0.22" stroke="#0F6CBD"/>
    <text x="304" y="273" fill="#7DD3FC">API and Sync</text>
    <rect x="440" y="248" width="156" height="38" rx="19" fill="#0F6CBD" fill-opacity="0.22" stroke="#0F6CBD"/>
    <text x="479" y="273" fill="#7DD3FC">SQL and SSRS</text>
    <rect x="610" y="248" width="158" height="38" rx="19" fill="#0F6CBD" fill-opacity="0.22" stroke="#0F6CBD"/>
    <text x="656" y="273" fill="#7DD3FC">AWS Portals</text>
    <rect x="782" y="248" width="176" height="38" rx="19" fill="#0F6CBD" fill-opacity="0.22" stroke="#0F6CBD"/>
