  <text x="80" y="162" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">I lead enterprise delivery across ERP, integrations, reporting, cloud, and infrastructure.</text>
  <text x="80" y="196" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500">My strength is operating at the seam between business and technology: understanding the real-world</text>
  <text x="80" y="220" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500">process, shaping the solution, driving execution, and getting hands-on when needed.</text>

