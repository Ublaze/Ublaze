<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgs" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0F1D33"/>
      <stop offset="1" stop-color="#0A2540"/>
    </linearGradient>
    <linearGradient id="goldlines" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D7A94B"/>
      <stop offset="1" stop-color="#D7A94B" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glows" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0F6CBD" stop-opacity="0.35"/>
